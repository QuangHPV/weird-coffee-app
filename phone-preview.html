<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile coffee preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #e9e3db; color: #30251e; font: 14px system-ui, sans-serif; }
    .controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .controls strong { margin-right: 8px; }
    button { padding: 7px 11px; border: 1px solid #c9b8a7; border-radius: 8px; background: #fffdfa; color: #30251e; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #704627; background: #704627; color: white; }
    .phone { width: 390px; height: 844px; max-width: 100%; margin: auto; overflow: hidden; border: 7px solid #30251e; border-radius: 38px; background: #f7f3ed; box-shadow: 0 18px 45px #30251e30; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 440px) { body { padding: 12px; } .phone { height: min(844px, calc(100dvh - 90px)); } }
  </style>
</head>
<body>
  <div class="controls" aria-label="Preview width">
    <strong>Phone preview · sample data</strong>
    <button type="button" data-width="375" aria-pressed="false">375px</button>
    <button type="button" data-width="390" aria-pressed="true">390px</button>
    <button type="button" data-width="430" aria-pressed="false">430px</button>
  </div>
  <div class="phone" id="phone"><iframe src="/?demo=1" title="Coffee mobile app phone preview"></iframe></div>
  <script>
    const preview = document.querySelector('iframe');
    let retried = false;
    preview.addEventListener('load', () => {
      if (retried) return;
      setTimeout(() => {
        try {
          const page = preview.contentDocument;
          const ready = page?.getElementById('network')?.textContent === 'Preview'
            && !page.getElementById('app')?.hidden
            && [...page.styleSheets].some(sheet => sheet.href?.includes('/src/style.css'));
          if (ready) return;
        } catch { /* Retry an incomplete local preview once. */ }
        retried = true;
        preview.src = `/?demo=1&retry=${Date.now()}`;
      }, 2500);
    });
    document.querySelectorAll('[data-width]').forEach(button => {
      button.onclick = () => {
        document.getElementById('phone').style.width = `${button.dataset.width}px`;
        document.querySelectorAll('[data-width]').forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
      };
    });
  </script>
</body>
</html>
